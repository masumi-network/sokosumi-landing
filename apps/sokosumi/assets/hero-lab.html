<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hero background lab | test.mp4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { font-family: "Inter", system-ui, sans-serif; background: #fafaf9; color: #0f0e0d; }
      header { padding: 34px 36px 6px; }
      h1 { font-size: 21px; font-weight: 500; letter-spacing: -0.01em; }
      header p { margin-top: 6px; font-size: 14px; color: rgba(15, 14, 13, 0.55); max-width: 70ch; }
      .v { margin: 34px 36px 54px; }
      .v h2 { font-size: 14px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
      .v p { margin: 5px 0 14px; font-size: 13.5px; color: rgba(15, 14, 13, 0.55); max-width: 78ch; }
      iframe {
        width: 100%; height: 80vh; display: block; border: 1px solid rgba(15, 14, 13, 0.12);
        border-radius: 8px; background: #0f0e0d;
      }
      .v a { color: inherit; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="labTitle">Hero background lab</h1>
      <p>Four drifting screenshots and five video treatments. Each frame is the live landing page, so the motion is real. Click a heading to open that variant full-screen.</p>
      <p id="clipSwitch" style="margin-top: 10px; font-size: 13px;"></p>
    </header>

    <div id="variants"></div>

    <script>
      var CLIPS = ["test", "hhhtest"];
      var vid = new URLSearchParams(location.search).get("vid") || CLIPS[0];
      document.getElementById("labTitle").textContent = "Hero background lab: " + vid + ".mp4";
      document.getElementById("clipSwitch").innerHTML =
        "Clip: " +
        CLIPS.map(function (c) {
          return c === vid
            ? "<strong>" + c + ".mp4</strong>"
            : '<a href="?vid=' + c + '">' + c + ".mp4</a>";
        }).join(" · ");

      var VARIANTS = [
        { url: "/", name: "A · Drifting screenshot: task board (current default)", desc: "shot-board.webp in a slow Ken Burns pan under a dark scrim. The default on the landing page." },
        { url: "/?bg=shot-roster", name: "B · Drifting screenshot: coworker roster", desc: "shot-roster.webp under the same drift and scrim." },
        { url: "/?bg=shot-brief", name: "C · Drifting screenshot: brief prompt", desc: "shot-brief.webp under the same drift and scrim." },
        { url: "/?bg=shot-chat2", name: "D · Drifting screenshot: coworker chat", desc: "shot-chat2.webp under the same drift and scrim." },
        { q: "", name: "1 · Video, monochrome (previous default)", desc: "Grayscale clip with the cinematic vignette scrim. Reachable directly at /?bg=video." },
        { q: "&bg=color", name: "2 · Video, full color", desc: "The clip untreated under the cinematic scrim." },
        { q: "&bg=ink", name: "3 · Video, ink wash", desc: "Flat, heavy dark overlay. The clip becomes a faint texture; maximum text focus, most minimal." },
        { q: "&bg=duo", name: "4 · Video, purple duotone", desc: "Grayscale clip washed in Wisteria purple. The strongest brand statement, and the most color." },
        { q: "&bg=blur", name: "5 · Video, frosted", desc: "Heavy blur turns the clip into slow-moving ambient color. Abstract, calm, no legibility fight at all." },
      ];
      document.getElementById("variants").innerHTML = VARIANTS.map(function (v) {
        var url = v.url || "/?vid=" + encodeURIComponent(vid) + v.q;
        return (
          '<div class="v"><h2><a href="' + url + '" target="_blank">' + v.name + "</a></h2>" +
          "<p>" + v.desc + "</p>" +
          '<iframe src="' + url + '" title="' + v.name + '" loading="lazy"></iframe></div>'
        );
      }).join("");
    </script>
  </body>
</html>
